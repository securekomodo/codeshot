name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...
      - name: render the samples
        run: |
          go run ./cmd/codeshot --preset code --sample -o /tmp/code.png
          go run ./cmd/codeshot --preset git-diff --sample -o /tmp/diff.svg
